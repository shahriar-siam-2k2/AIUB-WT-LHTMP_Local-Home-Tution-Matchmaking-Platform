<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LHTMP - Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div>
      <div class="brand-top">
        <div class="logo-icon">LHT</div>
        <p class="brand-name">LHTMP Portal</p>
      </div>
      <div class="login-card">
        <div class="card-header">
          <h1>
            Local Home Tuition <br />
            Matchmaking Platform
          </h1>
          <p>Connecting Students, Parents & Tutors</p>
          <div class="divider"></div>
        </div>
        <form class="login-form" method="post">
          <div class="form-group">
            <label for="role">Login As</label>
            <select id="role" name="role">
              <option value="" disabled selected>Select your role</option>
              <option value="student">Student</option>
              <option value="parent">Parent</option>
              <option value="tutor">Tutor</option>
              <option value="coordinator">Area Coordinator</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <div>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="email@email.com"
              />
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
              />
            </div>
          </div>
          <div class="forgot-link">
            <a href="#">Forgot password?</a>
          </div>

          <button
            type="button"
            class="btn-login"
            onclick="window.location.href = 'admin.html'"
          >
            Login to Admin Dashboard
          </button>

          <button
            type="button"
            class="btn-login"
            onclick="window.location.href = 'coordinator.html'"
          >
            Login to Coordinator Dashboard
          </button>

          <button
            type="button"
            class="btn-login"
            onclick="window.location.href = 'parent.html'"
          >
            Login to Parent Dashboard
          </button>

          <button
            type="button"
            class="btn-login"
            onclick="window.location.href = 'tutor.html'"
          >
            Login to Tutor Dashboard
          </button>

          <button
            type="button"
            class="btn-login"
            onclick="window.location.href = 'student.html'"
          >
            Login to Student Dashboard
          </button>

          <div class="or-divider"><span>OR</span></div>
          <button type="button" class="btn-register">Create New Account</button>
        </form>
        <div class="demo-credentials">
          <p class="demo-label">Demo Credentials</p>
          <p><span>Email: </span> simba@gmail.com | <span>Pass:</span> simba</p>
        </div>
      </div>
      <p class="page-footer">
        ©️ 2025 Local Home Tuition Matchmaking Platform. All rights reserved.
      </p>
    </div>
  </body>
</html>
